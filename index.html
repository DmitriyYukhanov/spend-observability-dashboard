<html lang="en">
<head>

<title>Provider balances</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#14161a; --muted:#6b7280; --line:#e3e6ea;
  --page:#b42318; --warn:#b54708; --ok:#067647; --info:#1849a9; --shadow:#5d6b98;
  --pagebg:#fef3f2; --warnbg:#fffaeb; --okbg:#ecfdf3; --infobg:#eff8ff; --shadowbg:#f2f4f7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --panel:#171a21; --ink:#e6e8ec; --muted:#98a2b3; --line:#262b35;
    --page:#fda29b; --warn:#fec84b; --ok:#75e0a7; --info:#84caff; --shadow:#b0b7c3;
    --pagebg:#2b1614; --warnbg:#2b2113; --okbg:#0f2a1d; --infobg:#11243a; --shadowbg:#1d2129;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:34px 0 10px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;
  text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.slug{color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.p-page{background:var(--pagebg);color:var(--page)}
.p-warn{background:var(--warnbg);color:var(--warn)}
.p-ok{background:var(--okbg);color:var(--ok)}
.p-info{background:var(--infobg);color:var(--info)}
.p-shadow{background:var(--shadowbg);color:var(--shadow)}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card .v{font-size:24px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.card .n{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px;min-width:90px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.low i{background:var(--page)}
.nodata{color:var(--muted);font-style:italic}
.note{color:var(--muted);font-size:12px;margin-top:3px;max-width:46ch}
.alerts{font-size:13px}
.alerts td{padding:9px 14px}
.ts{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.caveat{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--muted);
  border-radius:8px;padding:12px 16px;margin-top:12px;font-size:13px;color:var(--muted)}
.caveat b{color:var(--ink)}
footer{margin-top:36px;color:var(--muted);font-size:12px}
</style>
</head>

  <div class="panel scroll"><table id="alerts" class="alerts"></table></div>

<script>
(function(){
var D = JSON.parse(document.getElementById('payload').textContent);

// Everything from their API goes through this. It is their input, not ours.
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function n(v,d){ if(v===null||v===undefined) return '&mdash;';
  return Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function dur(h){
  if(h===null||h===undefined) return '&mdash;';
  if(h<48) return h.toFixed(1)+' h';
  return (h/24).toFixed(1)+' d';
}

var m=D.meta;
document.getElementById('sub').innerHTML =
  'Window '+esc(m.window_start)+' &rarr; '+esc(m.window_end)+
  ' &middot; '+m.window_hours+' h &middot; '+m.providers+' providers &middot; '+
  m.samples+' samples, '+m.pct_with_data+'% with data';

// hero: the one-glance answer
var alertable=D.rows.filter(function(r){return r.alertable;});
var soonest=D.rows.filter(function(r){return r.runway_h!==null&&r.runway_h!==undefined;})
                  .sort(function(a,b){return a.runway_h-b.runway_h;})[0];
var stale=D.quality.filter(function(q){return q.stale_polls>=6;});
var pages=D.alerts.filter(function(a){return a.severity==='page';});
var hero=[
  {k:'Actionable now',v:alertable.length,
   n:alertable.length?alertable.map(function(r){return esc(r.slug);}).join(', ')
                     :'nothing within the '+m.window_hours+' h lookback'},
  {k:'Soonest depletion',v:soonest?dur(soonest.runway_h):'&mdash;',
   n:soonest?esc(soonest.name)+' ('+esc(soonest.slug)+')':''},
  {k:'Providers silent now',v:stale.length,
   n:stale.length?stale.map(function(q){return esc(q.slug);}).join(', '):'all reporting'},
  {k:'Pages in log',v:pages.length,n:D.alerts.length+' alerts total'}
];
document.getElementById('hero').innerHTML=hero.map(function(c){
  return '<div class="card"><div class="k">'+c.k+'</div><div class="v">'+c.v+
         '</div><div class="n">'+c.n+'</div></div>';}).join('');

// runway table
var h='<thead><tr><th>Provider</th><th>Model</th><th class="num">Current</th>'+
      '<th class="num">Rate / h</th><th class="num">Runway</th><th>Status</th></tr></thead><tbody>';
D.rows.forEach(function(r){
  if(r.state==='nodata'){
    h+='<tr><td><b>'+esc(r.name)+'</b><div class="slug">'+esc(r.slug)+'</div></td>'+
       '<td>'+esc(r.model)+'</td><td colspan="3" class="nodata">no data in window &mdash; not zero</td>'+
       '<td><span class="pill p-shadow">no data</span></td></tr>';
    return;
  }
  var cur=n(r.value, r.unit==='credits'?0:2)+' <span class="slug">'+esc(r.unit)+'</span>';
  if(r.pct!==undefined&&r.pct!==null){
    var low=r.pct<25?' low':'';
    cur+='<div class="bar'+low+'"><i style="width:'+Math.max(0,Math.min(100,r.pct)).toFixed(1)+'%"></i></div>'+
         '<div class="slug">'+r.pct.toFixed(1)+'% of '+n(r.package,0)+'</div>';
  }
  var status,cls;
  if(r.stale_polls>=6){ status='silent '+r.stale_polls+' polls'; cls='p-warn'; }
  else if(r.alertable){ status='depletes within lookback'; cls='p-page'; }
  else if(r.before_reset===true){ status='burns out before reset'; cls='p-warn'; }
  else if(r.model==='postpaid'){ status='postpaid &mdash; sign is not a cutoff'; cls='p-info'; }
  else if(r.runway_h===null){ status='no downward trend'; cls='p-ok'; }
  else { status='indicative only'; cls='p-ok'; }
  var rw=dur(r.runway_h);
  if(r.runway_h!==null&&!r.alertable) rw='<span class="slug">~</span>'+rw;
  h+='<tr><td><b>'+esc(r.name)+'</b><div class="slug">'+esc(r.slug)+'</div>'+
     (r.note?'<div class="note">'+esc(r.note)+'</div>':'')+'</td>'+
     '<td>'+esc(r.model)+(r.refresh?'<div class="slug">resets '+esc(r.refresh)+'</div>':'')+'</td>'+
     '<td class="num">'+cur+'</td>'+
     '<td class="num">'+(r.rate===null?'&mdash;':n(r.rate, Math.abs(r.rate)<10?2:0))+'</td>'+
     '<td class="num">'+rw+'</td>'+
     '<td><span class="pill '+cls+'">'+status+'</span></td></tr>';
});
document.getElementById('runway').innerHTML=h+'</tbody>';

document.getElementById('runway-caveat').innerHTML=
  '<b>Runway marked ~ is indicative, not an alert.</b> A forecast is only treated as '+
  'actionable when its horizon fits inside the '+m.window_hours+' h of continuous history '+
  'backing it. Extrapolating days from hours is not a claim, so those figures are '+
  'published but never paged on. Rates are the median of windowed per-poll rates, not '+
  'first-to-last: a single top-up inverts the endpoint estimator (measured on openrouter, '+
  '+53.08/h endpoint against &minus;5.40/h median).';

// currency subtotals -- never a single total
var c='<thead><tr><th>Currency</th><th class="num">Vendor-held total</th>'+
      '<th class="num">Providers</th></tr></thead><tbody>';
Object.keys(D.by_currency).sort().forEach(function(k){
  var e=D.by_currency[k];
  c+='<tr><td><b>'+esc(k.toUpperCase())+'</b></td><td class="num">'+n(e[0],2)+
     '</td><td class="num">'+e[1]+'</td></tr>';
});
c+='<tr><td colspan="3" class="nodata">Credits are not summed into any currency, and no '+
   'cross-currency total is shown: credits, USD and GBP are not commensurable. '+
   'These are balances held at vendors, not company cash.</td></tr>';
document.getElementById('cur').innerHTML=c+'</tbody>';

// spend reports
var s='<thead><tr><th>Provider</th><th>Window</th><th class="num">Current</th>'+
      '<th class="num">Range in window</th><th>Note</th></tr></thead><tbody>';
D.spend.forEach(function(r){
  s+='<tr><td><b>'+esc(r.name)+'</b><div class="slug">'+esc(r.slug)+'</div></td>'+
     '<td>'+esc(r.window)+'</td>'+
     '<td class="num">'+n(r.value,2)+' <span class="slug">'+esc(r.unit)+'</span>'+
     (r.spend_24h!==null&&r.spend_24h!==undefined?
        '<div class="slug">24h '+n(r.spend_24h,2)+'</div>':'')+'</td>'+
     '<td class="num">'+n(r.lo,2)+' &ndash; '+n(r.hi,2)+'</td>'+
     '<td class="note">Rolling window. It moves in both directions as old periods age '+
     'out, so a fall is not a refund and a delta is not burn. No runway applies.</td></tr>';
});
document.getElementById('spend').innerHTML=s+'</tbody>';

// alerts
var a='<thead><tr><th>Time</th><th>Severity</th><th>Class</th><th>Provider</th>'+
      '<th>Text</th></tr></thead><tbody>';
if(!D.alerts.length){ a+='<tr><td colspan="5" class="nodata">no alerts</td></tr>'; }
D.alerts.forEach(function(x){
  var cls={page:'p-page',warn:'p-warn',info:'p-info',shadow:'p-shadow'}[x.severity]||'p-info';
  a+='<tr><td class="ts">'+esc(x.ts.slice(11,19))+'</td>'+
     '<td><span class="pill '+cls+'">'+esc(x.severity)+'</span></td>'+
     '<td>'+esc(x['class'])+'</td><td class="slug">'+esc(x.provider||'')+'</td>'+
     '<td>'+esc(x.text)+'</td></tr>';
});
document.getElementById('alerts').innerHTML=a+'</tbody>';

// quality
var q='<thead><tr><th>Provider</th><th class="num">Samples</th><th class="num">No data</th>'+
      '<th class="num">With data</th><th>Now</th></tr></thead><tbody>';
D.quality.slice().sort(function(x,y){return x.pct-y.pct;}).forEach(function(r){
  q+='<tr><td><b>'+esc(r.name)+'</b> <span class="slug">'+esc(r.slug)+'</span></td>'+
     '<td class="num">'+r.n+'</td><td class="num">'+r.no_data+'</td>'+
     '<td class="num">'+r.pct.toFixed(1)+'%</td><td>'+
     (r.stale_polls>=6?'<span class="pill p-warn">silent '+r.stale_polls+'</span>'
      :r.stale_polls>0?'<span class="slug">'+r.stale_polls+' missed</span>'
      :'<span class="pill p-ok">reporting</span>')+'</td></tr>';
});
document.getElementById('quality').innerHTML=q+'</tbody>';

document.getElementById('foot').innerHTML=
  'Generated '+esc(m.generated)+' from collector cycle '+esc(String(m.cycle))+
  '. Missing data is shown as missing and is never counted as zero. '+
  'Provider names and notes come from their API and are rendered as escaped text.';
})();
</script>
</body>
</html>
